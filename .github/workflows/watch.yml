name: 🎬 BMS Odyssey IMAX Watcher

on:
  # ── Scheduled checks ──────────────────────────────────────────────────────
  # Runs every 30 minutes. GitHub cron uses UTC (IST = UTC+5:30).
  schedule:
    - cron: '*/30 * * 7 *'   # Every 30 min throughout July
    - cron: '*/30 * 1 8 *'   # Every 30 min on Aug 1 UTC (covers Aug 1 IST morning)

  # ── Manual trigger (run from phone/browser anytime) ───────────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this manually?'
        required: false
        default: 'Manual check'

jobs:
  watch:
    name: Check for Odyssey IMAX tickets
    runs-on: ubuntu-latest

    # ✅ FIX 1: Declare the "bmsmail" environment so GitHub injects its secrets
    environment: bmsmail

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install Python deps ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Install Playwright + Chromium ────────────────────────────────────
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── 5. Run the watcher (single check) ───────────────────────────────────
      - name: Check BMS for Odyssey IMAX tickets
        id: check
        env:
          SENDER_EMAIL:        ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAILS:    ${{ secrets.RECIPIENT_EMAILS }}
        # ✅ FIX 2: Use `set +e` so the shell does NOT exit when Python returns
        #    a non-zero code. We capture the exit code manually instead.
        # Exit codes from watcher.py:
        #   0 = tickets found + email sent  ✅
        #   1 = not found yet               ⏳ (normal, not an error)
        #   2 = tickets found but email failed ❌
        run: |
          set +e
          python watcher.py --single-check
          WATCHER_EXIT=$?
          echo "EXIT_CODE=$WATCHER_EXIT" >> $GITHUB_OUTPUT
          echo "Watcher exited with code: $WATCHER_EXIT"

      # ── 6. Report outcome in the Actions log ────────────────────────────────
      - name: Report outcome
        run: |
          CODE="${{ steps.check.outputs.EXIT_CODE }}"
          echo "Exit code received: '$CODE'"
          if [ "$CODE" = "0" ]; then
            echo "🎉 TICKETS FOUND! Email sent to all recipients."
          elif [ "$CODE" = "1" ]; then
            echo "⏳ Odyssey IMAX not listed yet. Will check again in 30 min."
          else
            echo "❌ Something went wrong (exit code: '$CODE'). Check the logs above."
            exit 1
          fi
